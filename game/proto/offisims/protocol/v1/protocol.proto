// Game WebSocket protocol — binary protobuf over MessageBinary frames.
//
// The server is authoritative. Clients send intents, the server validates
// and broadcasts state updates.
//
// Movement model: client-side prediction with server reconciliation.
// The client moves locally (pixel-granular, local collision check),
// sends position updates ~15/sec while moving, and the server validates
// and relays to other clients in the same room.
//
// A single GameMessage envelope wraps all message types via oneof.
// This replaces the JSON { type: "..." } discriminator pattern.

syntax = "proto3";

package offisims.protocol.v1;

option go_package = "github.com/offisims/game/internal/game/pb/protocolv1";

// ─── Shared types ──────────────────────────────────────────────────

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DOWN = 1;
  DIRECTION_UP = 2;
  DIRECTION_LEFT = 3;
  DIRECTION_RIGHT = 4;
}

// Full avatar state snapshot sent to clients.
message AvatarSnapshot {
  string id = 1;
  string name = 2;
  // Character resource group ID (references a tag group in the pack).
  string character_id = 3;
  string room = 4;
  float x = 5;
  float y = 6;
  Direction direction = 7;
  bool moving = 8;
  // Current animation family (e.g. "idle", "walk").
  string family = 9;
}

// Room snapshot sent to clients on join / room change.
message RoomSnapshot {
  string name = 1;
  int32 width = 2;
  int32 height = 3;
}

// ─── Client → Server messages ──────────────────────────────────────

// Client requests to join the game.
// The token is obtained via POST /api/register and identifies the player.
message JoinRequest {
  string token = 1;
}

// Client reports its avatar's position.
// Sent periodically while moving (~15/sec).
message PositionUpdate {
  float x = 1;
  float y = 2;
  Direction direction = 3;
  bool moving = 4;
}

// Client requests to use a door (teleport to another room).
message UseDoor {
  string door_id = 1;
}

// Client sends a chat message to the current room.
message ChatSend {
  string text = 1;
}

// Client sends a private message to a specific avatar.
message PrivateMessageSend {
  string target_avatar_id = 1;
  string text = 2;
}

// Client requests to leave the game (graceful disconnect).
message LeaveRequest {}

// ─── Server → Client messages ──────────────────────────────────────

// Sent to a client immediately after joining.
message Welcome {
  string avatar_id = 1;
  RoomSnapshot room = 2;
  float spawn_x = 3;
  float spawn_y = 4;
  repeated AvatarSnapshot avatars = 5;
}

// Broadcast when a new avatar enters the client's current room.
message AvatarJoin {
  AvatarSnapshot avatar = 1;
}

// Broadcast when an avatar leaves the client's current room.
message AvatarLeave {
  string avatar_id = 1;
}

// Broadcast when another avatar moves within the client's current room.
// Clients interpolate between position updates for smooth rendering.
message AvatarMove {
  string avatar_id = 1;
  float x = 2;
  float y = 3;
  Direction direction = 4;
  bool moving = 5;
}

// Sent to a client when their avatar transitions to a new room.
message RoomChange {
  RoomSnapshot room = 1;
  float spawn_x = 2;
  float spawn_y = 3;
  repeated AvatarSnapshot avatars = 4;
}

// Chat message from an avatar in the client's current room.
message ChatReceive {
  string avatar_id = 1;
  string name = 2;
  string text = 3;
}

// Private message between two avatars.
message PrivateMessageReceive {
  string from_avatar_id = 1;
  string from_name = 2;
  string to_avatar_id = 3;
  string text = 4;
}

// Server corrects the client's avatar position.
// Sent when the server detects an invalid client position (e.g. inside a wall).
message Snap {
  float x = 1;
  float y = 2;
}

// Server reports an error to the client.
message Error {
  string message = 1;
}

// ─── Envelope ──────────────────────────────────────────────────────

// Single wrapper message — both client and server use this envelope.
// The oneof payload determines the message type.
message GameMessage {
  oneof payload {
    // Client → Server
    JoinRequest join = 1;
    PositionUpdate position = 2;
    UseDoor use_door = 3;
    ChatSend chat = 4;
    PrivateMessageSend private_message = 5;
    LeaveRequest leave = 6;

    // Server → Client
    Welcome welcome = 10;
    AvatarJoin avatar_join = 11;
    AvatarLeave avatar_leave = 12;
    AvatarMove avatar_move = 13;
    RoomChange room_change = 14;
    ChatReceive chat_message = 15;
    PrivateMessageReceive private_message_receive = 16;
    Snap snap = 17;
    Error error = 18;
  }
}

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip              on;
    gzip_min_length   512;
    gzip_types        text/html text/css application/javascript application/json image/svg+xml;

    # Atlas art and images are content-addressed by the pack — cache hard.
    location /pack/atlas/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # demo.js and pack.json carry no content hash, so revalidate instead of
    # caching: with ETags that is a cheap 304 and a redeploy is never stale.
    location = /demo.js       { add_header Cache-Control "no-cache"; }
    location = /pack/pack.json { add_header Cache-Control "no-cache"; }
    location = /index.html     { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

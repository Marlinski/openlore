<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offisims - Floor Plan Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left panel: tool palette */
    #palette {
      width: 300px;
      background: #16213e;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #palette h2 {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #333;
      background: #0f3460;
    }

    .palette-section {
      border-bottom: 1px solid #333;
      padding: 8px 12px;
    }
    .palette-section h3 {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    #tool-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
    #tool-buttons button {
      padding: 6px 12px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    #tool-buttons button:hover { background: #2a2a4e; }
    #tool-buttons button.active { background: #4a9eff; color: #000; }

    /* Floor tile picker */
    #floor-tiles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      max-height: 200px;
      overflow-y: auto;
    }
    .floor-tile-thumb {
      aspect-ratio: 1;
      background: #0a0a1a;
      border: 2px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      image-rendering: pixelated;
    }
    .floor-tile-thumb:hover { border-color: #4a9eff; }
    .floor-tile-thumb.selected { border-color: #ffcc00; }
    .floor-tile-thumb img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* Composite picker */
    #composite-filter {
      margin-bottom: 6px;
      display: flex;
      gap: 4px;
    }
    #composite-filter select, #composite-filter input {
      flex: 1;
      padding: 4px 6px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: 11px;
    }
    #composite-list-palette {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 8px;
    }
    .comp-palette-item {
      padding: 6px 8px;
      margin-bottom: 3px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .comp-palette-item:hover { border-color: #4a9eff; }
    .comp-palette-item.selected { border-color: #ffcc00; background: #2a2a0a; }
    .comp-palette-item .preview {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      position: relative;
      image-rendering: pixelated;
      background: #0a0a1a;
      border-radius: 3px;
      overflow: hidden;
    }
    .comp-palette-item .preview img {
      position: absolute;
      image-rendering: pixelated;
    }
    .comp-palette-item .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .comp-palette-item .name { font-weight: 600; font-size: 11px; }
    .comp-palette-item .meta { font-size: 10px; color: #888; }

    /* Center: canvas */
    #workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #top-bar {
      padding: 8px 16px;
      background: #0f3460;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #top-bar label { font-size: 12px; }
    #top-bar input, #top-bar select {
      padding: 4px 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 12px;
      width: 60px;
    }
    #top-bar input[type="text"] { width: 140px; }
    #top-bar button {
      padding: 6px 14px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #top-bar button:hover { background: #2a2a4e; }
    #top-bar input[type="checkbox"] { width: auto; }

    #canvas-container {
      flex: 1;
      overflow: auto;
      background: #0a0a1a;
      position: relative;
    }
    #room-canvas {
      position: relative;
      image-rendering: pixelated;
      transform-origin: top left;
    }
    .room-cell {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.08);
      box-sizing: border-box;
      cursor: crosshair;
    }
    .room-cell:hover { background: rgba(74, 158, 255, 0.1); }
    .room-cell.has-floor img, .room-cell.has-wall img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      pointer-events: none;
      position: absolute;
      top: 0; left: 0;
    }
    .room-cell .floor-img { z-index: 1; }
    .room-cell .wall-img { z-index: 2; }

    /* Placed composite overlays */
    .placed-composite {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }
    .placed-composite img {
      position: absolute;
      image-rendering: pixelated;
    }
    .placed-composite .occupancy-overlay {
      position: absolute;
      border: 2px solid rgba(255, 100, 100, 0.5);
      background: rgba(255, 100, 100, 0.1);
      pointer-events: none;
    }

    /* Ghost preview when placing */
    #ghost-preview {
      position: absolute;
      pointer-events: none;
      opacity: 0.6;
      z-index: 20;
    }
    #ghost-preview img {
      position: absolute;
      image-rendering: pixelated;
    }

    /* Right panel: placed objects */
    #objects-panel {
      width: 250px;
      background: #16213e;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #objects-panel h2 {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #333;
      background: #0f3460;
    }
    #objects-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .placed-obj-item {
      padding: 6px 8px;
      margin-bottom: 3px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .placed-obj-item:hover { border-color: #4a9eff; }
    .placed-obj-item button {
      padding: 2px 8px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
    }
    .placed-obj-item button:hover { background: #660000; }

    #file-bar {
      padding: 8px;
      border-top: 1px solid #333;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    #file-bar button {
      flex: 1;
      padding: 6px 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      min-width: 70px;
    }
    #file-bar button:hover { background: #2a2a4e; }

    #status {
      padding: 4px 16px;
      background: #0f3460;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <!-- Left: palette -->
  <div id="palette">
    <h2>Floor Plan Editor</h2>
    <div class="palette-section">
      <h3>Tools</h3>
      <div id="tool-buttons">
        <button id="tool-floor" class="active">Floor</button>
        <button id="tool-wall">Wall</button>
        <button id="tool-object">Object</button>
        <button id="tool-erase">Erase</button>
        <button id="tool-select">Select</button>
      </div>
    </div>
    <div class="palette-section" id="floor-section">
      <h3>Floor Tiles</h3>
      <div id="floor-tiles"></div>
    </div>
    <div class="palette-section" id="wall-section" style="display:none;">
      <h3>Wall Tiles</h3>
      <div id="wall-tiles"></div>
    </div>
    <div class="palette-section" id="object-section" style="display:none;">
      <h3>Composites</h3>
      <div id="composite-filter">
        <select id="comp-cat-filter">
          <option value="all">All</option>
          <option value="furniture">Furniture</option>
          <option value="decor">Decor</option>
          <option value="electronics">Electronics</option>
          <option value="plant">Plant</option>
          <option value="door">Door</option>
          <option value="window">Window</option>
          <option value="other">Other</option>
        </select>
        <input type="text" id="comp-name-filter" placeholder="Search..." />
      </div>
    </div>
    <div id="composite-list-palette"></div>
  </div>

  <!-- Center: workspace -->
  <div id="workspace">
    <div id="top-bar">
      <label>Room:</label>
      <input type="text" id="room-name" value="Office" />
      <label>W:</label>
      <input type="number" id="room-w" value="16" min="4" max="64" />
      <label>H:</label>
      <input type="number" id="room-h" value="12" min="4" max="64" />
      <button id="btn-resize">Resize</button>
      <label>Zoom:</label>
      <select id="zoom-level">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="3">3x</option>
      </select>
      <label><input type="checkbox" id="show-grid" checked /> Grid</label>
      <label><input type="checkbox" id="show-occupancy" /> Occupancy</label>
    </div>
    <div id="canvas-container">
      <div id="room-canvas">
        <div id="ghost-preview" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- Right: placed objects -->
  <div id="objects-panel">
    <h2>Placed Objects</h2>
    <div id="objects-list"></div>
    <div id="file-bar">
      <button id="btn-save-room">Save Room</button>
      <button id="btn-load-room">Load Room</button>
      <button id="btn-export-room">Export</button>
      <button id="btn-import-composites">Load Composites</button>
    </div>
  </div>

  <div id="status">Ready. Choose a tool and start editing.</div>

  <script type="module" src="./main.ts"></script>
</body>
</html>

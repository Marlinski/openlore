<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offisims - Room Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #toolbar {
      padding: 8px 16px;
      background: #0f3460;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #toolbar button {
      padding: 6px 14px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #toolbar button:hover { background: #2a2a4e; }
    #toolbar label { font-size: 12px; }
    #toolbar input[type="checkbox"] { margin-right: 4px; }
    #toolbar select {
      padding: 4px 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 12px;
    }

    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #canvas-container canvas {
      image-rendering: pixelated;
    }

    #status {
      padding: 4px 16px;
      background: #0f3460;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-load-room">Load Room</button>
    <button id="btn-load-composites">Load Composites</button>
    <label><input type="checkbox" id="show-grid" /> Grid</label>
    <label><input type="checkbox" id="show-occupancy" /> Occupancy</label>
    <label>Scale:</label>
    <select id="scale-select">
      <option value="1">1x</option>
      <option value="2" selected>2x</option>
      <option value="3">3x</option>
      <option value="4">4x</option>
    </select>
    <button id="btn-add-character">Add Character</button>
    <label>Char:</label>
    <select id="char-select">
      <option value="adam">Adam</option>
      <option value="alex">Alex</option>
      <option value="amelia">Amelia</option>
      <option value="bob">Bob</option>
    </select>
  </div>
  <div id="canvas-container"></div>
  <div id="status">Load a room and composites to preview.</div>

  <script type="module" src="./main.ts"></script>
</body>
</html>

// Pack data types — single source of truth for all Offisims data shapes.
//
// These types are shared between Studio (authoring) and Game (runtime).
// Studio stores entities as individual JSON files. When compiling a pack,
// Studio serialises them into the binary protobuf Pack message.
// The game server reads packs and runs sessions on top of them.

syntax = "proto3";

package offisims.pack.v1;

option go_package = "github.com/offisims/shared/pack/pb/packv1";

// ─── Tileset ───────────────────────────────────────────────────────

// TilesetDefinition describes a tileset image and its grid layout.
// Each tileset has a unique ID and the metadata needed to interpret
// tile coordinates (tile size, grid dimensions) plus the image path.
message TilesetDefinition {
  string id = 1;
  string label = 2;
  // Image source — URL path (e.g. "/data/tilesets/foo.png") or data-URL.
  string path = 3;
  int32 tile_width = 4;
  int32 tile_height = 5;
  int32 cols = 6;
  int32 rows = 7;
}

// TilesetRegion is a rectangular region within a tileset image,
// measured in tiles. The fundamental building block for placements
// and composite parts.
message TilesetRegion {
  string tileset_id = 1;
  int32 src_col = 2;
  int32 src_row = 3;
  int32 w = 4;
  int32 h = 5;
}

// ─── Composite Object ──────────────────────────────────────────────

// CompositePart is one piece of a composite object — a tileset region
// positioned within the composite's local coordinate space.
message CompositePart {
  TilesetRegion region = 1;
  int32 offset_x = 2;
  int32 offset_y = 3;
  // Manual z-order bias for render-time sorting within the composite.
  // Added to the anchor Y (bottom edge) when computing sort order.
  int32 z_bias = 4;
}

// CompositeObject is a multi-tile object assembled from tileset regions.
// Used for large objects that span multiple regions (e.g. a conference table).
message CompositeObject {
  string id = 1;
  string name = 2;
  // Field 3 reserved — was SpriteCategory category, removed (use tags instead).
  reserved 3;
  repeated CompositePart parts = 4;
  // Total display size in tiles (computed from parts bounding box).
  int32 display_width = 5;
  int32 display_height = 6;
}

// ─── Room ──────────────────────────────────────────────────────────

// DoorDefinition is a single-tile teleport point connecting two rooms.
// Target format: "roomName#doorId" (e.g. "lobby#door-2").
// An empty target means the door is not yet connected.
message DoorDefinition {
  string id = 1;
  int32 col = 2;
  int32 row = 3;
  string target = 4;
}

enum PlacementLayer {
  PLACEMENT_LAYER_UNSPECIFIED = 0;
  PLACEMENT_LAYER_FLOOR = 1;
  PLACEMENT_LAYER_OBJECT = 2;
}

// TexturePlacement is a visual element placed on the room grid.
// References either a tileset region directly, or a composite by ID.
// Multiple textures can stack on the same tile.
message TexturePlacement {
  int32 grid_x = 1;
  int32 grid_y = 2;
  PlacementLayer layer = 3;
  // For direct tileset placements. Unset if composite_id is used.
  TilesetRegion region = 4;
  // For composite placements. Empty if region is used.
  string composite_id = 5;
  // Manual z-order bias for render-time sorting.
  int32 z_bias = 6;
}

// RoomDefinition holds layout (walkability, doors) and texture placements.
message RoomDefinition {
  string name = 1;
  int32 width = 2;
  int32 height = 3;
  // Flat array of width*height booleans. Index = row * width + col.
  // true = walkable, false = blocked.
  repeated bool walkability = 4;
  repeated DoorDefinition doors = 5;
  repeated TexturePlacement placements = 6;
}

// ─── Resource ──────────────────────────────────────────────────────

// ResourceFrame is a single frame referencing a rectangular tile region
// in a source tileset image. Coordinates are in tiles (not pixels).
message ResourceFrame {
  string tileset_id = 1;
  int32 src_col = 2;
  int32 src_row = 3;
  int32 w = 4;
  int32 h = 5;
}

// Resource is a tagged sequence of frames. A static sprite has one frame.
// Resources are tagged with arbitrary strings for grouping, filtering,
// and semantic meaning. A "character" is a set of resources sharing a
// common group tag (e.g. "adam") with animation tags ("idle", "walk", etc.).
message Resource {
  string id = 1;
  string name = 2;
  repeated string tags = 3;
  repeated ResourceFrame frames = 4;
}

// ─── Mask ──────────────────────────────────────────────────────────

// MaskCut defines one cut within a mask template.
// When applied, each cut creates one Resource.
message MaskCut {
  repeated string tags = 1;
  int32 row = 2;
  int32 start_frame = 3;
  int32 frame_count = 4;
  // Width/height of each frame in tiles. 0 means 1 (default).
  int32 frame_width = 5;
  int32 frame_height = 6;
}

// Mask is a reusable cut template for batch-creating tagged resources
// from a tileset. Created by the Tile Cutter: you manually cut a tileset
// into resources, then "Save as Mask" captures the cut pattern. Later,
// the same mask can be applied to a different tileset of the same shape.
message Mask {
  string id = 1;
  string name = 2;
  int32 tile_width = 3;
  int32 tile_height = 4;
  repeated MaskCut cuts = 5;
}

// ─── Pack ──────────────────────────────────────────────────────────

// PackManifest is the identity and metadata of a pack.
// Stored as manifest.json (human-readable) alongside the binary data.
message PackManifest {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string author = 5;
  string created = 6;  // ISO-8601
  string updated = 7;  // ISO-8601
}

// Pack is the top-level container — a bundle of rooms, resources,
// tilesets, composites and masks. Studio authors packs; the game
// server loads them and runs sessions on top of them.
message Pack {
  PackManifest manifest = 1;
  repeated TilesetDefinition tilesets = 2;
  repeated CompositeObject composites = 3;
  repeated RoomDefinition rooms = 4;
  repeated Resource resources = 5;
  repeated Mask masks = 6;
}
